name: Extract REAL AKS-74U Magazine Payload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Kraken/Oodle decompressor
        run: python -m pip install --disable-pip-version-check kraken-decompressor==0.2.1

      - name: Decode real SM_AKS74U_Magazine MeshDescription payload
        run: |
          rm -rf output
          python tools/extract_real_mag.py source/SM_AKS74U_Magazine.uasset --out output | tee extraction.log

      - name: Verify exact payload size
        run: |
          test -f output/SM_AKS74U_Magazine_MeshDescription.bin
          test "$(stat -c%s output/SM_AKS74U_Magazine_MeshDescription.bin)" = "154805"
          cat output/report.json

      - name: Upload real magazine payload
        uses: actions/upload-artifact@v4
        with:
          name: aks74u-real-mag-payload
          retention-days: 14
          path: |
            output/**
            extraction.log
